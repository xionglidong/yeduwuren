<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>单次作答报告</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: { primary: '#2563EB', accent: '#F59E0B' },
          screens: { 'print': { 'raw': 'print' } }
        }
      }
    };
  </script>
  <style>
    body { background: #eef2ff; padding: 24px; font-family: 'Segoe UI', Roboto, 'PingFang SC', sans-serif; }
    .page { background: white; width: 210mm; max-width: calc(100vw - 48px); margin: 0 auto; min-height: 297mm; padding: 18mm 18mm 16mm; box-shadow: 0 20px 60px rgba(15, 23, 42, 0.14); }
    .section-title { border-left: 4px solid #2563EB; padding-left: 10px; font-weight: 800; color: #1f2937; display: inline-flex; align-items: center; }
    .tag-badge { display: inline-flex; align-items: center; padding: 4px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; border: 1px solid transparent; margin-right: 6px; margin-bottom: 6px; }
    .detail-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
    .report-table { width: 100%; border-collapse: collapse; table-layout: fixed; }
    .report-table th, .report-table td { border: 1px solid #e5e7eb; padding: 10px 12px; vertical-align: top; }
    .report-table th { background: #f8fafc; color: #475569; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
    .answer-card { break-inside: avoid; page-break-inside: avoid; }
    .media-grid { }
    .media-grid img { width: 100%; max-height: 320px; object-fit: contain; border: 1px solid #e5e7eb; border-radius: 12px; background: #fff; }
    .question-item { break-inside: avoid; page-break-inside: avoid; }
    .summary-shell { position: relative; overflow: hidden; border-radius: 28px; border: 1px solid #dbeafe; background: linear-gradient(135deg, #eff6ff 0%, #ffffff 42%, #f5f3ff 100%); box-shadow: 0 18px 40px rgba(37, 99, 235, 0.08); }
    .summary-shell::before { content: ''; position: absolute; width: 240px; height: 240px; right: -80px; top: -120px; background: radial-gradient(circle, rgba(96, 165, 250, 0.24) 0%, rgba(96, 165, 250, 0) 70%); }
    .summary-shell::after { content: ''; position: absolute; width: 260px; height: 260px; left: -110px; bottom: -150px; background: radial-gradient(circle, rgba(168, 85, 247, 0.16) 0%, rgba(168, 85, 247, 0) 72%); }
    .summary-inner { position: relative; z-index: 1; }
    .summary-layout {  }
    .student-head { display: flex; align-items: center; gap: 16px; }
    .student-name-block { min-width: 0; flex: 1; }
    .student-title-row { display: flex; flex-direction: column; align-items: flex-start; gap: 12px; }
    .identity-chip { display: inline-flex; align-items: center; gap: 8px; border-radius: 999px; padding: 6px 12px; background: rgba(255, 255, 255, 0.88); border: 1px solid rgba(191, 219, 254, 0.8); color: #2563eb; font-size: 12px; font-weight: 700; box-shadow: 0 6px 18px rgba(148, 163, 184, 0.08); }
    .info-card {  width: calc(50% - 10px); border-radius: 18px; border: 1px solid rgba(226, 232, 240, 0.9); background: rgba(255, 255, 255, 0.92); padding: 14px 16px; box-shadow: 0 10px 24px rgba(148, 163, 184, 0.08); }
    .info-label { font-size: 11px; font-weight: 700; color: #94a3b8; text-transform: uppercase; letter-spacing: .08em; display: flex; align-items: center; gap: 6px; }
    .info-value { margin-top: 8px; font-size: 16px; font-weight: 800; color: #0f172a; line-height: 1.45; word-break: break-word; }
    .score-panel { border-radius: 24px; border: 1px solid rgba(191, 219, 254, 0.95); background: linear-gradient(160deg, rgba(255,255,255,0.96) 0%, rgba(239,246,255,0.96) 56%, rgba(238,242,255,0.96) 100%); padding: 20px; box-shadow: inset 0 1px 0 rgba(255,255,255,0.85), 0 14px 30px rgba(37, 99, 235, 0.08); }
    .score-hero { border-radius: 22px; padding: 18px 20px; background: linear-gradient(135deg, #2563eb 0%, #4f46e5 52%, #7c3aed 100%); color: white; box-shadow: 0 16px 28px rgba(79, 70, 229, 0.28); }
    .score-main { font-size: 42px; line-height: 1; font-weight: 900; letter-spacing: -0.03em; }
    .metric-grid { }
    .metric-tile { border-radius: 18px; padding: 14px 20px; background: rgba(255,255,255,0.95); border: 1px solid rgba(219, 234, 254, 0.95); box-shadow: 0 10px 22px rgba(148, 163, 184, 0.08); }
    .metric-title { font-size: 11px; font-weight: 700; color: #64748b; text-transform: uppercase; letter-spacing: .08em; display: flex; align-items: center; gap: 6px; }
    .metric-value { margin-top: 10px; font-size: 15px; font-weight: 800; color: #0f172a; line-height: 1.5; }
    .tag-panel { border-radius: 18px; padding: 14px 16px; background: rgba(255,255,255,0.94); border: 1px dashed #cbd5e1; box-shadow: 0 8px 20px rgba(148, 163, 184, 0.08); }
    .avatar-shell { width: 88px; height: 88px; border-radius: 999px; display: flex; align-items: center; justify-content: center; position: relative; background: linear-gradient(135deg, #ffffff 0%, #dbeafe 45%, #ede9fe 100%); border: 4px solid rgba(255,255,255,0.96); box-shadow: 0 14px 28px rgba(37, 99, 235, 0.12); overflow: hidden; flex-shrink: 0; }
    .avatar-shell::after { content: ''; position: absolute; inset: 8px; border-radius: 999px; border: 1px solid rgba(148, 163, 184, 0.16); }
    .avatar-text { position: relative; z-index: 1; font-size: 32px; line-height: 1; font-weight: 900; color: #1d4ed8; text-shadow: 0 2px 10px rgba(255,255,255,0.8); }
    .avatar-icon { position: absolute; right: 14px; bottom: 12px; font-size: 16px; color: rgba(99, 102, 241, 0.42); z-index: 1; }
    .student-badge-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; width: 100%; max-width: 360px; }
    .student-badge { border-radius: 16px; padding: 12px 14px; background: rgba(255,255,255,0.92); border: 1px solid rgba(219, 234, 254, 0.95); box-shadow: 0 10px 20px rgba(148, 163, 184, 0.07); }
    .student-badge-title { font-size: 11px; font-weight: 700; color: #64748b; text-transform: uppercase; letter-spacing: .08em; display: flex; align-items: center; gap: 6px; white-space: nowrap; }
    .student-badge-value { margin-top: 8px; font-size: 18px; font-weight: 900; color: #0f172a; line-height: 1.35; word-break: keep-all; }
    .student-badge-sub { margin-top: 4px; font-size: 12px; color: #64748b; word-break: keep-all; }
    @page { size: A4 portrait; margin: 10mm; }
    @media print {
      body { background: white; padding: 0; margin: 0; }
      .page { box-shadow: none; max-width: none; width: 100%; min-height: auto; margin: 0; padding: 12mm 12mm 10mm; }
      .no-print { display: none !important; }
      * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
      .summary-layout {  }
      .student-head { align-items: flex-start !important; }
      .student-title-row { flex-direction: column !important; align-items: flex-start !important; gap: 12px !important; }
      .student-badge-grid { grid-template-columns: repeat(2, minmax(0, 1fr)) !important; width: 100% !important; max-width: 360px !important; }
      .student-badge-title { letter-spacing: .04em !important; }
      .student-badge-value { font-size: 16px !important; }
      .student-badge-sub { font-size: 11px !important; }
      .detail-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .report-table th, .report-table td { padding: 8px 10px; font-size: 12px; }
      .tag-badge { font-size: 10px; padding: 3px 8px; }
      .summary-shell, .info-card, .metric-tile, .score-panel, .score-hero, .tag-panel, .avatar-shell, .student-badge { box-shadow: none !important; }
    }
    @media (max-width: 768px) {
      body { padding: 0; background: white; }
      .page { width: 100%; max-width: 100%; padding: 20px 16px 32px; box-shadow: none; }
      .summary-layout {  }
      .student-head { align-items: flex-start; }
      .student-title-row { flex-direction: column; }
      .detail-grid, .media-grid { }
      .metric-grid { }
      .student-badge-grid { grid-template-columns: 1fr; }
      .score-main { font-size: 34px; }
    }
  </style>
</head>
<body>
  <div class="fixed top-6 right-6 flex flex-col gap-3 no-print z-50">
    <button onclick="window.print()" class="bg-blue-600 text-white px-6 py-3 rounded-full shadow-lg hover:bg-blue-700 transition font-bold flex items-center">
      <i class="fa fa-print mr-2"></i> 打印 / 存为PDF
    </button>
    <button onclick="window.close()" class="bg-gray-700 text-white px-6 py-3 rounded-full shadow-lg hover:bg-gray-800 transition flex items-center">
      <i class="fa fa-times mr-2"></i> 关闭页面
    </button>
  </div>

  <div class="page">
    <header class="border-b-4 border-primary pb-5 mb-6">
      <div class="flex items-start justify-between gap-4">
        <div>
          <p class="text-sm text-blue-600 font-bold mb-2"><i class="fa fa-university mr-2"></i>野渡无人喊你做题</p>
          <h1 class="text-3xl font-black text-gray-900" id="paperName">单次作答详细报告</h1>
        </div>
        <div class="text-right text-sm text-gray-500">
          <p>生成时间</p>
          <p id="generatedAt" class="font-bold text-gray-700">--</p>
        </div>
      </div>
    </header>

    <section class="mb-6">
      <div class="summary-shell p-5 md:p-6">
        <div class="summary-inner summary-layout">

          <div class="mb-5 student-head">
              <div class="avatar-shell">
                <img id="rptAvatarImg" src="" alt="Avatar" class="w-full h-full object-cover transition-transform group-hover:scale-110">
              </div>
              <div class="student-name-block">
                <div class="student-title-row">
                  <div class="min-w-0">
                    <div id="studentName" class="mt-2 text-3xl font-black text-slate-900 break-words">--</div>
                    <div id="studentTitle" class="mt-2 text-base font-extrabold text-amber-600">--</div>
                  </div>
                  
                </div>
              </div>
            </div>

          <div style="display: flex;justify-content: space-between;">
            
            <div class="" style="display: flex;flex-wrap: wrap;gap: 10px;">
              <div class="info-card">
                <div class="info-label"><i class="fa fa-id-badge text-blue-500"></i>总积分</div>
                <div id="studentPoints" class="info-value">--</div>
              </div>
              <div class="info-card">
                <div class="info-label"><i class="fa fa-id-badge text-blue-500"></i>积分排名</div>
                <div  class="info-value">
                  <span id="studentPointsRank" class="info-value"></span> / <span id="studentPointsRankSub" class="info-value"></span>
                </div>
              </div>
              <div class="info-card">
                <div class="info-label"><i class="fa fa-id-badge text-blue-500"></i>学号</div>
                <div id="studentId" class="info-value">--</div>
              </div>
              <div class="info-card">
                <div class="info-label"><i class="fa fa-graduation-cap text-indigo-500"></i>所属年级</div>
                <div id="studentGrade" class="info-value">--</div>
              </div>
              <div class="info-card">
                <div class="info-label"><i class="fa fa-book text-emerald-500"></i>套题类型</div>
                <div id="paperType" class="info-value">--</div>
              </div>
              <div class="info-card">
                <div class="info-label"><i class="fa fa-list-ol text-amber-500"></i>题目总量</div>
                <div id="paperCount" class="info-value">--</div>
              </div>
              <div class="info-card md:col-span-2" style="width: 98% !important;">
                <div class="info-label"><i class="fa fa-clock-o text-rose-500"></i>提交时间</div>
                <div id="submitTime" class="info-value">--</div>
              </div>
            </div>


            <div class="score-panel" style="flex-shrink: 0;">
            <div class="score-hero">
              <div class="flex items-start justify-between">
                <div>
                  <div class="text-xs uppercase tracking-[0.24em] text-blue-100 font-bold">本次得分</div>
                  <div id="scoreText" class="score-main mt-3">--</div>
                  <div class="mt-3 inline-flex items-center rounded-full bg-white/18 px-3 py-1 text-sm font-semibold text-blue-50">
                    <div class="flex" style="flex-direction: column;align-items: center;">
                      <div><i class="fa fa-trophy mr-2"></i>满分</div>
                      <div id="scoreTotal" class="ml-1">--</div>
                    </div>
                     <div class="ml-8">
                      <span>本次排名</span>
                      <div id="attemptRank" class="ml-1">--</div>
                     </div>
                  </div>
                </div>
                <div class="absolute right-5 w-14 h-14 rounded-2xl bg-white/18 flex items-center justify-center text-2xl text-white shadow-inner">
                  <i class="fa fa-bar-chart"></i>
                </div>
              </div>
            </div>
            <div class="metric-grid mt-2" style="display: flex;justify-content: space-between;">
              <div class="metric-tile">
                <div class="metric-title"><i class="fa fa-area-chart text-violet-500"></i>平均分</div>
                <div id="paperAverageScore" class="metric-value">--</div>
              </div>
              <div class="metric-tile">
                <div class="metric-title"><i class="fa fa-star text-amber-500"></i>最高分</div>
                <div id="bestScore" class="metric-value">--</div>
              </div>
            </div>
            <div id="tagPanel" class="tag-panel mt-4">
              <div class="metric-title"><i class="fa fa-tags text-fuchsia-500"></i>注明</div>
              <div id="tagList" class="flex flex-wrap mt-3"></div>
            </div>
          </div>
          </div>

          
          


        </div>
      </div>
    </section>

    <section id="timerRecordSection" class="mb-6">
      <h2 class="section-title text-lg mb-4"><i class="fa fa-clock-o text-indigo-500 mr-2"></i>用时与中途记录</h2>
      <div class="bg-gray-50 border border-gray-200 rounded-2xl p-5">
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-4">
          <div class="bg-white rounded-xl border px-4 py-2 flex flex-col justify-center">
            <span class="text-xs text-gray-400 font-bold mb-0.5">推荐时长</span>
            <span id="reportRecommendedTime" class="font-extrabold text-gray-900 text-base">--</span>
          </div>
          <div class="bg-white rounded-xl border px-4 py-2 flex flex-col justify-center">
            <span class="text-xs text-gray-400 font-bold mb-0.5">实际做题时间</span>
            <span id="reportActualTime" class="font-extrabold text-gray-900 text-base">--</span>
          </div>
          <div class="bg-white rounded-xl border px-4 py-2 flex flex-col justify-center">
            <span class="text-xs text-gray-400 font-bold mb-0.5">中途事项数量</span>
            <span id="reportEventsCount" class="font-extrabold text-gray-900 text-base">--</span>
          </div>
        </div>
        
        <div id="reportEventsSection" class="bg-white border border-gray-150 rounded-xl p-4 hidden animate-fadeIn" style="margin-top: 15px; border-radius: 12px; padding: 15px; border: 1px solid #e2e8f0;">
          <h5 class="font-bold text-gray-700 flex items-center mb-2" style="font-size: 13px;">
            <i class="fa fa-list-ul text-indigo-500 mr-2"></i><span>中途事项记录</span>
          </h5>
          <ul id="reportEventsList" class="space-y-1 text-xs text-gray-650 pl-4" style="list-style-type: decimal; padding-left: 20px; font-size: 12px; line-height: 1.6;">
          </ul>
        </div>
      </div>
    </section>

    <section class="mb-6">
      <h2 class="section-title text-lg mb-4"><i class="fa fa-check-square-o text-blue-500 mr-2"></i>选择题作答明细</h2>
      <div class="overflow-hidden rounded-2xl border border-gray-200">
        <table class="report-table">
          <thead>
            <tr>
              <th style="width: 25%;">题号</th>
              <th style="width: 25%;">你的答案</th>
              <th style="width: 25%;">正确答案</th>
              <th style="width: 25%;">结果</th>
            </tr>
          </thead>
          <tbody id="choiceDetails"></tbody>
        </table>
      </div>
    </section>

    <section id="fillSection" class="mb-6 hidden">
      <h2 class="section-title text-lg mb-4"><i class="fa fa-edit text-emerald-500 mr-2"></i>填空 / 简答题作答明细</h2>
      <div class="bg-gray-50 border border-gray-200 rounded-2xl p-5">
        <div class="flex flex-wrap gap-4 text-sm mb-4">
          <div class="bg-white rounded-xl border px-4 py-2"><span class="text-gray-400">填空题得分</span><span id="fillScore" class="ml-2 font-bold text-gray-900">--</span></div>
          <div class="bg-white rounded-xl border px-4 py-2"><span class="text-gray-400">题目数量</span><span id="fillCount" class="ml-2 font-bold text-gray-900">--</span></div>
        </div>
        <div id="fillDetailList" class="space-y-3 mb-5"></div>
        <div class="media-grid">
          <div class="bg-white rounded-2xl border border-gray-200 p-4">
            <h3 class="font-bold text-gray-800 mb-3">学生作答图片</h3>
            <div id="studentFillImages" class="space-y-3"></div>
          </div>
        </div>
      </div>
    </section>

    <section id="draftSection" class="mb-6 hidden">
      <h2 class="section-title text-lg mb-4"><i class="fa fa-file-image-o text-violet-500 mr-2"></i>选择题草稿纸附件</h2>
      <div class="bg-gray-50 border border-gray-200 rounded-2xl p-5">
        <div id="draftImages" class="media-grid"></div>
      </div>
    </section>

    <section id="correctionSection" class="mb-6 hidden">
      <h2 class="section-title text-lg mb-4"><i class="fa fa-pencil-square-o text-purple-500 mr-2"></i>学生改错</h2>
      <div class="bg-gray-50 border border-gray-200 rounded-2xl p-5">
        <div class="flex flex-wrap gap-4 text-sm mb-4">
          <div class="bg-white rounded-xl border px-4 py-2"><span class="text-gray-400">改错提交时间</span><span id="correctionTime" class="ml-2 font-bold text-gray-900">--</span></div>
        </div>
        <div id="correctionImages" class="media-grid space-y-3"></div>
      </div>
    </section>
  </div>

  <script>
    const TAG_THEMES = [
      'bg-rose-100 text-rose-700 border-rose-200',
      'bg-amber-100 text-amber-700 border-amber-200',
      'bg-emerald-100 text-emerald-700 border-emerald-200',
      'bg-sky-100 text-sky-700 border-sky-200',
      'bg-indigo-100 text-indigo-700 border-indigo-200',
      'bg-fuchsia-100 text-fuchsia-700 border-fuchsia-200',
      'bg-teal-100 text-teal-700 border-teal-200',
      'bg-orange-100 text-orange-700 border-orange-200'
    ];

    function escapeHtmlText(value) {
      return String(value || '').replace(/[&<>"']/g, (char) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[char]));
    }
    function getQuestionScore(answer, standard, isMultiple, singlePoints) {
      const studentAns = answer || '';
      const stdAns = standard || '';
      if (isMultiple) {
        if (!studentAns || !stdAns) return { score: 0, status: 'incorrect', text: '错误' };
        const stdOptions = stdAns.split('');
        const studentOptions = studentAns.split('');
        let hasWrong = false;
        let correctCount = 0;
        for (let char of studentOptions) {
          if (stdOptions.includes(char)) correctCount++;
          else hasWrong = true;
        }
        if (hasWrong || correctCount === 0) {
          return { score: 0, status: 'incorrect', text: '错误' };
        } else {
          if (correctCount === stdOptions.length) {
            return { score: 6, status: 'correct', text: '全对' };
          } else if (stdOptions.length === 2) {
            if (correctCount === 1) return { score: 3, status: 'partial', text: '部分对' };
          } else if (stdOptions.length === 3) {
            if (correctCount === 1) return { score: 2, status: 'partial', text: '部分对' };
            else if (correctCount === 2) return { score: 4, status: 'partial', text: '部分对' };
          }
        }
        return { score: 0, status: 'incorrect', text: '错误' };
      } else {
        if (studentAns === stdAns) {
          const pts = parseFloat(singlePoints) || 0;
          return { score: pts, status: 'correct', text: '正确' };
        }
        return { score: 0, status: 'incorrect', text: '错误' };
      }
    }
    function normalizeTags(tags) {
      if (Array.isArray(tags)) return Array.from(new Set(tags.map((item) => String(item || '').trim()).filter(Boolean)));
      return Array.from(new Set(String(tags || '').split(/[，,]/).map((item) => String(item || '').trim()).filter(Boolean)));
    }
    function tagTheme(tag) {
      const text = String(tag || '');
      let hash = 0;
      for (let i = 0; i < text.length; i++) hash = (hash * 31 + text.charCodeAt(i)) >>> 0;
      return TAG_THEMES[hash % TAG_THEMES.length];
    }
    function renderTags(tags) {
      const normalized = normalizeTags(tags);
      if (normalized.length === 0) return '<span class="tag-badge bg-gray-100 text-gray-400 border-gray-200">暂无</span>';
      return normalized.map((tag) => `<span class="tag-badge ${tagTheme(tag)}">${escapeHtmlText(tag)}</span>`).join('');
    }
    function paperTypeLabel(type) {
      const map = { test: '课上测试', homework: '课后作业', correction: '整理错题', custom: '自定义题库' };
      return map[type] || '课上测试';
    }
    function renderImageList(containerId, images) {
      const container = document.getElementById(containerId);
      const list = Array.isArray(images) ? images.filter(Boolean) : (images ? [images] : []);
      if (!container) return;
      if (list.length === 0) {
        container.innerHTML = '<div class="text-sm text-gray-400">暂无图片</div>';
        return;
      }
      container.innerHTML = list.map((src) => `<img src="${src}" alt="图片">`).join('');
    }

    window.addEventListener('DOMContentLoaded', () => {
      const key = new URLSearchParams(window.location.search).get('key');
      if (!key) {
        document.body.innerHTML = '<div class="p-10 text-center text-gray-500">未找到报告数据</div>';
        return;
      }
      const raw = localStorage.getItem(key);
      if (!raw) {
        document.body.innerHTML = '<div class="p-10 text-center text-gray-500">报告数据已失效，请重新导出</div>';
        return;
      }
      let payload = null;
      try {
        payload = JSON.parse(raw);
      } catch (err) {
        document.body.innerHTML = '<div class="p-10 text-center text-gray-500">报告数据解析失败</div>';
        return;
      }
	      document.getElementById('generatedAt').textContent = payload.generatedAt || '--';
	      const studentName = payload.student?.name || '--';
	      document.getElementById('studentName').textContent = studentName;
	      document.getElementById('studentId').textContent = payload.student?.id || '--';
	      document.getElementById('studentGrade').textContent = payload.student?.grade || '--';
	      document.getElementById('studentPoints').textContent = `${payload.student?.points ?? 0}分`;
	      document.getElementById('studentPointsRank').textContent = payload.student?.pointsRank ? `第 ${payload.student.pointsRank} 名` : '--';
	      document.getElementById('studentPointsRankSub').textContent = payload.student?.studentCount ? `${payload.student.studentCount} 人` : '';
	      document.getElementById('studentTitle').textContent = payload.student?.pointsTitle || '--';
	      document.getElementById('submitTime').textContent = payload.record?.submitTime || '--';
	      document.getElementById('correctionTime').textContent = payload.record?.correctionTime || '--';
      document.getElementById('paperName').textContent = payload.paper?.name || '--';
      document.getElementById('paperType').textContent = paperTypeLabel(payload.paper?.type);
      const totalCount = (payload.paper?.questionCount || 0) + (payload.paper?.fillInBlankCount || 0);
      document.getElementById('paperCount').textContent = `${totalCount} 题`;
      document.getElementById('scoreText').textContent = `${payload.record?.totalScore ?? 0}分`;
      document.getElementById('scoreTotal').textContent = `${payload.paper?.totalPoints ?? 0}分`;
	      document.getElementById('attemptRank').textContent = payload.record?.attemptRank ? `第 ${payload.record.attemptRank} 名` : '--';
	      document.getElementById('paperAverageScore').textContent = `${payload.paper?.averageScore ?? 0}分`;
	      document.getElementById('bestScore').textContent = `${payload.record?.paperHighestScore ?? payload.record?.bestScore ?? 0}分`;
	      
        // 渲染推荐用时、实际用时和中途事项
        const recTime = payload.record?.recommendedTime || 0;
        document.getElementById('reportRecommendedTime').textContent = recTime ? `${recTime} 分钟` : '未设置';
        
        const actTime = payload.record?.actualTimeElapsed || 0;
        const actMin = Math.floor(actTime / 60);
        const actSec = actTime % 60;
        const isBreach = actTime > 7200 || payload.record?.timeDisplay === '超过2小时(违约)' || payload.record?.actualTimeElapsed === '超过2小时(违约)';
        document.getElementById('reportActualTime').textContent = isBreach ? '超过2小时(违约)' : `${actMin}分${actSec}秒`;
        
        const events = Array.isArray(payload.record?.interimEvents) ? payload.record.interimEvents : [];
        document.getElementById('reportEventsCount').textContent = `${events.length} 个`;
        
        const eventsSection = document.getElementById('reportEventsSection');
        const eventsList = document.getElementById('reportEventsList');
        if (events.length > 0 && eventsSection && eventsList) {
          eventsSection.classList.remove('hidden');
          eventsList.innerHTML = events.map(e => `<li>${escapeHtmlText(e)}</li>`).join('');
        } else if (eventsSection) {
          eventsSection.classList.add('hidden');
        }
	      const normalizedTags = normalizeTags(payload.record?.tags || []);
	      const tagPanel = document.getElementById('tagPanel');
	      if (normalizedTags.length === 0) {
	        if (tagPanel) tagPanel.classList.add('hidden');
	      } else {
	        if (tagPanel) tagPanel.classList.remove('hidden');
	        document.getElementById('tagList').innerHTML = renderTags(normalizedTags);
	      }

      const img = document.getElementById('rptAvatarImg');
      if (img.src === '' || img.src === window.location.href) img.src = `https://api.dicebear.com/7.x/adventurer/svg?seed=${payload.student?.id || 0}&backgroundColor=b6e3f4`;

      const choiceBody = document.getElementById('choiceDetails');
      const studentAnswers = Array.isArray(payload.record?.answers) ? payload.record.answers : [];
      const standardAnswers = Array.isArray(payload.paperContent?.answers) ? payload.paperContent.answers : [];
      const options = payload.paperContent?.options || {};
      if (studentAnswers.length === 0) {
        choiceBody.innerHTML = '<tr><td colspan="5" class="text-center text-gray-400 py-6">暂无选择题作答</td></tr>';
      } else {
        choiceBody.innerHTML = studentAnswers.map((answer, index) => {
          const correct = standardAnswers[index] || '';
          const isMultiple = payload.paperContent?.questionTypes && payload.paperContent.questionTypes[index] === 'multiple';
          const qInfo = getQuestionScore(answer, correct, isMultiple, payload.paperContent?.singlePoints);
          
          let colorClass = 'text-red-700';
          let statusText = '回答错误';
          if (qInfo.status === 'correct') {
            colorClass = 'text-green-700';
            statusText = '回答正确';
          } else if (qInfo.status === 'partial') {
            colorClass = 'text-amber-600';
            statusText = `部分对 (+${qInfo.score}分)`;
          } else {
            statusText = `回答错误 (+0分)`;
          }

          let optionText = '';
          if (correct) {
            optionText = correct.split('').map(opt => `${opt}: ${options[opt] || ''}`).join('; ');
          }
          
          return `<tr class="question-item">
            <td class="font-bold text-gray-700">${index + 1} (${isMultiple ? '多选' : '单选'})</td>
            <td class="${colorClass} font-bold">${escapeHtmlText(answer || '未作答')}</td>
            <td class="font-bold text-gray-800">${escapeHtmlText(correct || '--')}</td>
            <td class="font-bold ${colorClass}">${statusText}</td>
            <td class="text-gray-600 text-xs">${escapeHtmlText(optionText || '无选项内容')}</td>
          </tr>`;
        }).join('');
      }

      const fillCount = parseInt(payload.paper?.fillInBlankCount, 10) || 0;
      if (fillCount > 0) {
        document.getElementById('fillSection').classList.remove('hidden');
        document.getElementById('fillScore').textContent = `${payload.record?.fillInBlankScore ?? 0} 分`;
        document.getElementById('fillCount').textContent = `${fillCount} 题`;
        const detailList = document.getElementById('fillDetailList');
        const details = Array.isArray(payload.record?.fillInBlankDetails) ? payload.record.fillInBlankDetails : [];
        const fbPointsArray = Array.isArray(payload.paperContent?.fbPointsArray) ? payload.paperContent.fbPointsArray : [];
        detailList.innerHTML = new Array(fillCount).fill(0).map((_, index) => {
          const maxScore = fbPointsArray.length > 0 ? (fbPointsArray[index] || 0) : (payload.paperContent?.fillInBlankPoints || 0);
          const score = details[index];
          let scoreText = '--';
          if (typeof score === 'boolean') scoreText = score ? `${maxScore} / ${maxScore}` : `0 / ${maxScore}`;
          else if (score !== undefined && score !== null && score !== '') scoreText = `${score} / ${maxScore}`;
          return `<div class="bg-white border border-gray-200 rounded-xl px-4 py-3 text-sm">
            <span class="font-bold text-gray-800">第 ${index + 1} 题</span>
            <span class="ml-3 text-gray-500">得分：</span>
            <span class="font-bold text-indigo-600">${scoreText}</span>
          </div>`;
        }).join('');
        renderImageList('studentFillImages', payload.record?.fillInBlankStudentImage || []);
      }

      const drafts = Array.isArray(payload.record?.draftImages) ? payload.record.draftImages.filter(Boolean) : [];
      if (drafts.length > 0) {
        document.getElementById('draftSection').classList.remove('hidden');
        renderImageList('draftImages', drafts);
      }
      const correctionImages = Array.isArray(payload.record?.correctionImages) ? payload.record.correctionImages.filter(Boolean) : [];
      if (correctionImages.length > 0) {
        document.getElementById('correctionSection').classList.remove('hidden');
        renderImageList('correctionImages', correctionImages);
      }
    });
  </script>
</body>
</html>
